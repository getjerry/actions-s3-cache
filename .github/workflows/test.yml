on:
  pull_request:
  push:
    branches:
      - master

env:
  AWS_DEFAULT_REGION: ap-northeast-1

jobs:
  test_cache_miss_and_upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v2
      # pull_request: subject pull_request on gha-pr; push to master: ref:refs/heads/master on
      # gha-nonprod (a test cache object, nothing prod).
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ github.event_name == 'pull_request' && 'arn:aws:iam::919341117301:role/gha-pr' || 'arn:aws:iam::919341117301:role/gha-nonprod' }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}
      - run: npm ci
      - name: set up php 7.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: 7.3.x
      - name: assert cache miss
        uses: ./
        with:
          s3-bucket: ${{ secrets.S3Bucket }}
          cache-key: composer-v1-${{ hashFiles('test/composer.lock') }}-${{ env.GITHUB_RUN_ID }}
          paths: vendor
          command: composer install -n --prefer-dist
          zip-option: -ryq
          unzip-opton: -n
          working-directory: test
      - run: test -d test/vendor
      - name: assert cache exit
        run: aws s3 ls s3://${{ secrets.S3Bucket }}/composer-v1-${{ hashFiles('test/composer.lock') }}-${{ env.GITHUB_RUN_ID }}.zip

  test_cache_hit:
    needs: [test_cache_miss_and_upload]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v2
      # pull_request: subject pull_request on gha-pr; push to master: ref:refs/heads/master on
      # gha-nonprod (a test cache object, nothing prod).
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ github.event_name == 'pull_request' && 'arn:aws:iam::919341117301:role/gha-pr' || 'arn:aws:iam::919341117301:role/gha-nonprod' }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}
      - run: npm ci
      - name: set up php 7.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: 7.3.x
      - name: assert cache hit
        uses: ./
        with:
          s3-bucket: ${{ secrets.S3Bucket }}
          cache-key: composer-v1-${{ hashFiles('test/composer.lock') }}-${{ env.GITHUB_RUN_ID }}
          paths: vendor
          command: composer install -n --prefer-dist
          zip-option: -ryq
          unzip-opton: -n
          working-directory: test
      - run: test -d test/vendor
      - name: clean up
        run: aws s3 rm s3://${{ secrets.S3Bucket }}/composer-v1-${{ hashFiles('test/composer.lock') }}-${{ env.GITHUB_RUN_ID }}.zip
